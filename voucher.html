<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tukar Voucher - Canon-Ipad Booth</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-6">
    <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden md:max-w-2xl p-6">
        <h1 class="text-2xl font-bold text-center mb-6 text-gray-800">Tukar Voucher Canon-Ipad Booth</h1>
        
        <!-- Section Login -->
        <div id="loginSection" class="text-center">
            <p class="mb-4 text-gray-600">Silakan login dengan Google untuk menukar voucher.</p>
            <button id="loginBtn" class="bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-4 rounded">
                Login dengan Google
            </button>
        </div>

        <!-- Section Cek Voucher -->
        <div id="voucherSection" class="hidden mt-4">
            <p id="userInfo" class="text-sm text-gray-600 mb-4 text-center"></p>
            <div class="flex gap-2">
                <input type="text" id="voucherCode" placeholder="Masukkan Kode Voucher" class="border p-2 w-full rounded">
                <button id="checkVoucherBtn" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded">Cek</button>
            </div>
            <p id="voucherMsg" class="text-sm mt-2 font-semibold"></p>
        </div>

        <!-- Section Form Pendaftaran -->
        <div id="formSection" class="hidden mt-6 border-t pt-4">
            <form id="registrationForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Nama</label>
                    <input type="text" id="nama" required class="mt-1 block w-full border border-gray-300 rounded-md p-2">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">No HP/WA</label>
                    <input type="tel" id="nohp" required class="mt-1 block w-full border border-gray-300 rounded-md p-2">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Nama IG (Opsional - Untuk ikut lomba)</label>
                    <input type="text" id="ig" class="mt-1 block w-full border border-gray-300 rounded-md p-2">
                </div>
                
                <!-- Checkbox Lomba (Hidden by default) -->
                <div id="lombaDiv" class="hidden flex items-start mt-2 p-3 bg-yellow-50 rounded">
                    <input type="checkbox" id="persetujuanLomba" class="mt-1 mr-2">
                    <label for="persetujuanLomba" class="text-sm text-gray-700">Saya menyetujui hasil foto dipublikasikan untuk keperluan lomba.</label>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Paket Photobooth</label>
                    <select id="paket" required class="mt-1 block w-full border border-gray-300 rounded-md p-2">
                        <option value="">Memuat paket...</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Waktu (Hari & Jam)</label>
                    <input type="datetime-local" id="waktu" required class="mt-1 block w-full border border-gray-300 rounded-md p-2">
                </div>
                
                <div class="bg-blue-100 border-l-4 border-blue-500 text-blue-700 p-4 mb-4" role="alert">
                    <p class="font-bold">Informasi</p>
                    <p>Voucher tetap berlaku walaupun lewat jadwal yang sudah ditetapkan.</p>
                </div>

                <button type="submit" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded">
                    Kirim Pendaftaran
                </button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getDatabase, ref, get, set, push, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDdM-1ziZLq2r8P1qpgHM763ke8GUPitvw",
            authDomain: "dasborusaha.firebaseapp.com",
            databaseURL: "https://dasborusaha-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "dasborusaha",
            storageBucket: "dasborusaha.firebasestorage.app",
            messagingSenderId: "427165972600",
            appId: "1:427165972600:web:a0731cbf737717d567558d",
            measurementId: "G-TL37HXZ834"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        let currentUser = null;
        let validVoucherCode = "";

        // Elements
        const loginSection = document.getElementById('loginSection');
        const voucherSection = document.getElementById('voucherSection');
        const formSection = document.getElementById('formSection');
        const igInput = document.getElementById('ig');
        const lombaDiv = document.getElementById('lombaDiv');
        const paketSelect = document.getElementById('paket');

        // Login
        document.getElementById('loginBtn').addEventListener('click', () => {
            const provider = new GoogleAuthProvider();
            signInWithPopup(auth, provider);
        });

        // Auth State
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                loginSection.classList.add('hidden');
                voucherSection.classList.remove('hidden');
                document.getElementById('userInfo').innerText = `Masuk sebagai: ${user.email}`;
                loadPaket();
            }
        });

        // Load Paket for Select Box
        async function loadPaket() {
            const snap = await get(ref(db, 'settings/paket'));
            if (snap.exists()) {
                paketSelect.innerHTML = '<option value="">Pilih Paket...</option>';
                snap.forEach(child => {
                    paketSelect.innerHTML += `<option value="${child.val()}">${child.val()}</option>`;
                });
            }
        }

        // Cek Voucher
        document.getElementById('checkVoucherBtn').addEventListener('click', async () => {
            const code = document.getElementById('voucherCode').value.trim();
            const msg = document.getElementById('voucherMsg');
            if(!code) return;

            const vRef = ref(db, 'vouchers/' + code);
            const snap = await get(vRef);
            
            if (snap.exists() && snap.val().status === 'aktif') {
                msg.innerText = "Voucher Valid! Silakan isi form di bawah.";
                msg.className = "text-sm mt-2 font-semibold text-green-600";
                formSection.classList.remove('hidden');
                validVoucherCode = code;
                document.getElementById('voucherCode').disabled = true;
            } else {
                msg.innerText = "Voucher tidak valid atau sudah digunakan.";
                msg.className = "text-sm mt-2 font-semibold text-red-600";
                formSection.classList.add('hidden');
            }
        });

        // Logic memunculkan persetujuan lomba
        igInput.addEventListener('input', (e) => {
            if(e.target.value.trim() !== "") {
                lombaDiv.classList.remove('hidden');
            } else {
                lombaDiv.classList.add('hidden');
                document.getElementById('persetujuanLomba').checked = false;
            }
        });

        // Submit Form
        document.getElementById('registrationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const data = {
                nama: document.getElementById('nama').value,
                nohp: document.getElementById('nohp').value,
                ig: document.getElementById('ig').value,
                lomba: document.getElementById('persetujuanLomba').checked,
                paket: document.getElementById('paket').value,
                waktu: document.getElementById('waktu').value,
                voucher: validVoucherCode,
                email: currentUser.email,
                timestamp: Date.now()
            };

            try {
                // Simpan pendaftaran
                await push(ref(db, 'pendaftaran'), data);
                // Ubah status voucher jadi terpakai
                await update(ref(db, 'vouchers/' + validVoucherCode), { status: 'terpakai', digunakanOleh: currentUser.email });
                
                alert('Pendaftaran berhasil! Sampai jumpa di lokasi.');
                window.location.reload();
            } catch (error) {
                alert('Terjadi kesalahan: ' + error.message);
            }
        });
    </script>
</body>
</html>
