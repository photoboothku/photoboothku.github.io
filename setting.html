<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Dasbor Canon-Ipad Booth</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Poppins', sans-serif; }</style>
</head>
<body class="bg-gray-100 p-6 min-h-screen">
    
    <div class="max-w-7xl mx-auto space-y-6">
        <div class="flex justify-between items-center mb-6 border-b pb-4">
            <h1 class="text-3xl font-bold text-gray-800">Dasbor Admin</h1>
            <button id="logoutBtn" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg font-semibold text-sm">Keluar</button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Panel Generator Voucher (Kiri) -->
            <div class="bg-white p-6 rounded-2xl shadow border-t-4 border-blue-500 lg:col-span-1">
                <h2 class="text-xl font-bold mb-4 text-gray-800">Buat Voucher Baru</h2>
                <form id="voucherGeneratorForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700">Jenis Voucher</label>
                        <select id="jenisVoucher" required class="mt-1 w-full border border-gray-300 rounded-lg p-2.5 bg-gray-50">
                            <option value="Diskon %">Diskon Persentase (%)</option>
                            <option value="Diskon Nominal">Diskon Nominal Harga (Rp)</option>
                            <option value="Lainnya">Lainnya (Barang/Gratis)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700">Besaran (Contoh: 30 atau 15000)</label>
                        <input type="text" id="besaranVoucher" required placeholder="Masukkan nilai" class="mt-1 w-full border border-gray-300 rounded-lg p-2.5 bg-gray-50">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700">Masa Berlaku</label>
                        <input type="date" id="expiredVoucher" required class="mt-1 w-full border border-gray-300 rounded-lg p-2.5 bg-gray-50">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700">Jumlah Voucher Dibuat</label>
                        <input type="number" id="jumlahVoucher" required min="1" max="100" value="1" class="mt-1 w-full border border-gray-300 rounded-lg p-2.5 bg-gray-50">
                    </div>
                    
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg mt-4 transition">
                        Generate Voucher Otomatis
                    </button>
                </form>
            </div>

            <!-- Panel Daftar Voucher (Tengah) -->
            <div class="bg-white p-6 rounded-2xl shadow lg:col-span-2">
                <h2 class="text-xl font-bold mb-4 text-gray-800">Daftar Voucher</h2>
                <div class="overflow-x-auto h-80 border rounded-lg">
                    <table class="min-w-full table-auto text-sm">
                        <thead class="bg-gray-100 sticky top-0">
                            <tr>
                                <th class="px-4 py-2 text-left text-gray-600">Kode</th>
                                <th class="px-4 py-2 text-left text-gray-600">Jenis & Besaran</th>
                                <th class="px-4 py-2 text-left text-gray-600">Berlaku s/d</th>
                                <th class="px-4 py-2 text-left text-gray-600">Status</th>
                                <th class="px-4 py-2 text-left text-gray-600">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="voucherList" class="divide-y"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mt-6">
            <!-- Manajemen Paket Photobooth -->
            <div class="bg-white p-6 rounded-2xl shadow lg:col-span-1 border-t-4 border-green-500">
                <h2 class="text-xl font-bold mb-4 text-gray-800">Paket Photobooth</h2>
                
                <!-- Form Input/Edit Paket -->
                <div class="mb-4 space-y-3 bg-gray-50 p-4 rounded-lg border">
                    <input type="hidden" id="paketId">
                    <input type="text" id="namaPaket" placeholder="Nama Paket (cth: Paket Grup)" required class="border p-2.5 w-full rounded-lg">
                    <input type="number" id="hargaPaket" placeholder="Harga (Rp)" required class="border p-2.5 w-full rounded-lg">
                    <textarea id="deskripsiPaket" placeholder="Deskripsi/Detail paket..." rows="2" class="border p-2.5 w-full rounded-lg"></textarea>
                    
                    <div class="flex gap-2">
                        <button id="savePaketBtn" class="flex-1 bg-green-500 hover:bg-green-600 text-white py-2 rounded-lg font-bold">Simpan</button>
                        <button id="cancelEditBtn" class="hidden bg-gray-400 hover:bg-gray-500 text-white px-4 py-2 rounded-lg font-bold">Batal</button>
                    </div>
                </div>

                <ul id="paketList" class="space-y-3 max-h-60 overflow-y-auto pr-2"></ul>
            </div>

            <!-- Daftar Pendaftar -->
            <div class="bg-white p-6 rounded-2xl shadow lg:col-span-2">
                <h2 class="text-xl font-bold mb-4 text-gray-800">Pendaftar (Tukar Voucher)</h2>
                <div class="overflow-x-auto">
                    <table class="min-w-full table-auto text-sm">
                        <thead class="bg-gray-100">
                            <tr>
                                <th class="px-4 py-2 text-left text-gray-600">Nama / Kontak</th>
                                <th class="px-4 py-2 text-left text-gray-600">Paket / Jadwal</th>
                                <th class="px-4 py-2 text-left text-gray-600">IG (Lomba)</th>
                                <th class="px-4 py-2 text-left text-gray-600">Kode Voucher Dipakai</th>
                            </tr>
                        </thead>
                        <tbody id="pendaftarList" class="divide-y"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getDatabase, ref, onValue, set, push, update, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDdM-1ziZLq2r8P1qpgHM763ke8GUPitvw",
            authDomain: "dasborusaha.firebaseapp.com",
            databaseURL: "https://dasborusaha-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "dasborusaha",
            storageBucket: "dasborusaha.firebasestorage.app",
            messagingSenderId: "427165972600",
            appId: "1:427165972600:web:a0731cbf737717d567558d",
            measurementId: "G-TL37HXZ834"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        onAuthStateChanged(auth, (user) => { if (!user) window.location.href = 'index.html'; });
        document.getElementById('logoutBtn').addEventListener('click', () => { signOut(auth).then(() => window.location.href = 'index.html'); });

        // --- 1. FITUR VOUCHER ---
        function generateRandomCode() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let code = '';
            for (let i = 0; i < 5; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
            return code;
        }

        document.getElementById('voucherGeneratorForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const jenis = document.getElementById('jenisVoucher').value;
            const besaran = document.getElementById('besaranVoucher').value;
            const expired = document.getElementById('expiredVoucher').value;
            const jumlah = parseInt(document.getElementById('jumlahVoucher').value);

            for (let i = 0; i < jumlah; i++) {
                await set(ref(db, 'vouchers/' + generateRandomCode()), {
                    status: 'aktif', jenis: jenis, besaran: besaran, expired: expired, dibuatPada: Date.now()
                });
            }
            alert(`${jumlah} Voucher berhasil dibuat!`);
            e.target.reset();
        });

        onValue(ref(db, 'vouchers'), (snapshot) => {
            const list = document.getElementById('voucherList');
            list.innerHTML = '';
            const today = new Date().toISOString().split('T')[0];

            snapshot.forEach((child) => {
                const data = child.val();
                let statusBadge = "";
                
                // Cek status dan kadaluarsa di tampilan admin
                if(data.status === 'terpakai') {
                    statusBadge = `<span class="bg-red-100 text-red-700 px-2 py-1 rounded-full text-xs font-bold">Terpakai</span>`;
                } else if (data.expired < today) {
                    statusBadge = `<span class="bg-gray-200 text-gray-700 px-2 py-1 rounded-full text-xs font-bold">Kedaluwarsa</span>`;
                } else {
                    statusBadge = `<span class="bg-green-100 text-green-700 px-2 py-1 rounded-full text-xs font-bold">Aktif</span>`;
                }
                
                let tampilanBesaran = data.besaran;
                if(data.jenis === "Diskon %") tampilanBesaran = data.besaran + "%";
                if(data.jenis === "Diskon Nominal") tampilanBesaran = "Rp " + parseInt(data.besaran).toLocaleString('id-ID');

                list.innerHTML += `
                    <tr class="hover:bg-gray-50">
                        <td class="px-4 py-3 font-bold tracking-widest text-gray-800">${child.key}</td>
                        <td class="px-4 py-3">${data.jenis}<br><span class="font-semibold text-blue-600">${tampilanBesaran}</span></td>
                        <td class="px-4 py-3 text-gray-600 text-xs">${data.expired}</td>
                        <td class="px-4 py-3">${statusBadge}</td>
                        <td class="px-4 py-3">
                            <button class="text-white bg-red-500 hover:bg-red-600 px-2 py-1 rounded text-xs delete-voucher" data-id="${child.key}">Hapus</button>
                        </td>
                    </tr>`;
            });
            
            document.querySelectorAll('.delete-voucher').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    if(confirm('Yakin ingin menghapus voucher ini?')) {
                        await remove(ref(db, 'vouchers/' + e.target.getAttribute('data-id')));
                    }
                });
            });
        });

        // --- 2. FITUR PAKET LENGKAP (CRUD) ---
        const savePaketBtn = document.getElementById('savePaketBtn');
        const cancelEditBtn = document.getElementById('cancelEditBtn');
        const paketIdInput = document.getElementById('paketId');
        const namaPaketInput = document.getElementById('namaPaket');
        const hargaPaketInput = document.getElementById('hargaPaket');
        const deskripsiPaketInput = document.getElementById('deskripsiPaket');

        // Fungsi Bersihkan Form
        function resetPaketForm() {
            paketIdInput.value = '';
            namaPaketInput.value = '';
            hargaPaketInput.value = '';
            deskripsiPaketInput.value = '';
            savePaketBtn.innerText = 'Simpan';
            savePaketBtn.className = 'flex-1 bg-green-500 hover:bg-green-600 text-white py-2 rounded-lg font-bold';
            cancelEditBtn.classList.add('hidden');
        }

        cancelEditBtn.addEventListener('click', resetPaketForm);

        // Tambah / Update Paket
        savePaketBtn.addEventListener('click', async () => {
            const id = paketIdInput.value;
            const nama = namaPaketInput.value.trim();
            const harga = hargaPaketInput.value;
            const deskripsi = deskripsiPaketInput.value.trim();

            if(!nama || !harga) {
                alert("Nama dan Harga wajib diisi!");
                return;
            }

            const dataPaket = { nama, harga, deskripsi };

            if(id) {
                // Proses Edit
                await update(ref(db, 'settings/paket/' + id), dataPaket);
            } else {
                // Proses Tambah Baru
                await push(ref(db, 'settings/paket'), dataPaket);
            }
            resetPaketForm();
        });

        // Tampilkan Daftar Paket
        onValue(ref(db, 'settings/paket'), (snapshot) => {
            const list = document.getElementById('paketList');
            list.innerHTML = '';
            
            snapshot.forEach((child) => {
                const data = child.val();
                // Antisipasi data paket lama yang hanya string
                const nama = typeof data === 'object' ? data.nama : data;
                const harga = typeof data === 'object' && data.harga ? data.harga : 0;
                const deskripsi = typeof data === 'object' && data.deskripsi ? data.deskripsi : "-";
                
                list.innerHTML += `
                    <li class="bg-white p-3 rounded-lg border shadow-sm flex flex-col gap-2">
                        <div>
                            <div class="flex justify-between items-start">
                                <span class="font-bold text-gray-800">${nama}</span>
                                <span class="text-blue-600 font-bold text-sm">Rp ${parseInt(harga).toLocaleString('id-ID')}</span>
                            </div>
                            <p class="text-xs text-gray-500 mt-1">${deskripsi}</p>
                        </div>
                        <div class="flex justify-end gap-2 border-t pt-2 mt-1">
                            <button class="text-blue-500 hover:text-blue-700 text-xs font-bold edit-paket" 
                                data-id="${child.key}" data-nama="${nama}" data-harga="${harga}" data-deskripsi="${deskripsi}">Edit</button>
                            <button class="text-red-500 hover:text-red-700 text-xs font-bold delete-paket" 
                                data-id="${child.key}">Hapus</button>
                        </div>
                    </li>`;
            });

            // Action Hapus
            document.querySelectorAll('.delete-paket').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    if(confirm("Hapus paket ini?")) {
                        await remove(ref(db, 'settings/paket/' + e.target.getAttribute('data-id')));
                    }
                });
            });

            // Action Edit
            document.querySelectorAll('.edit-paket').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    paketIdInput.value = e.target.getAttribute('data-id');
                    namaPaketInput.value = e.target.getAttribute('data-nama');
                    hargaPaketInput.value = e.target.getAttribute('data-harga');
                    deskripsiPaketInput.value = e.target.getAttribute('data-deskripsi');
                    
                    savePaketBtn.innerText = 'Update Paket';
                    savePaketBtn.className = 'flex-1 bg-blue-500 hover:bg-blue-600 text-white py-2 rounded-lg font-bold';
                    cancelEditBtn.classList.remove('hidden');
                });
            });
        });

        // --- 3. DAFTAR PENDAFTAR ---
        onValue(ref(db, 'pendaftaran'), (snapshot) => {
            const tbody = document.getElementById('pendaftarList');
            tbody.innerHTML = '';
            snapshot.forEach((child) => {
                const data = child.val();
                const lombaStatus = data.lomba ? "✅ Ya" : "❌ Tidak";
                const jadwal = new Date(data.waktu).toLocaleString('id-ID');
                
                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50 border-b">
                        <td class="px-4 py-3">
                            <span class="font-bold text-gray-800">${data.nama}</span><br>
                            <span class="text-sm text-gray-600">WA: ${data.nohp}</span>
                        </td>
                        <td class="px-4 py-3">
                            <span class="font-medium text-blue-600">${data.paket}</span><br>
                            <span class="text-sm text-gray-500">${jadwal}</span>
                        </td>
                        <td class="px-4 py-3">
                            ${data.ig || '-'}<br>
                            <span class="text-xs text-gray-500">Lomba: ${lombaStatus}</span>
                        </td>
                        <td class="px-4 py-3">
                            <span class="bg-yellow-200 text-yellow-800 font-bold px-3 py-1 rounded tracking-widest">${data.voucher}</span>
                        </td>
                    </tr>`;
            });
        });
    </script>
</body>
</html>
